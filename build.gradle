plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'com.gradleup.shadow' version '9.4.1'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
}

configurations {
    shadow
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // JDA and discord-webhooks are on Maven Central
    shadow 'net.dv8tion:JDA:6.7.0'
    shadow 'club.minnced:discord-webhooks:0.8.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_version as int
}

shadowJar {
    archiveClassifier.set("")
    configurations = [project.configurations.shadow]

    relocate 'net.dv8tion', 'com.warzedev.blurpstone.shadow.jda'
    relocate 'club.minnced.discord.webhook', 'com.warzedev.blurpstone.shadow.webhook'
}

jar {
    archiveClassifier.set("dev")
}

build.dependsOn shadowJar